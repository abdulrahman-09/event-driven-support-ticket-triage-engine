spring.application.name=ticket-triage-service
server.port=8081

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ticketing}
spring.data.mongodb.auto-index-creation=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=ticket-triage-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=ticketEvent:com.am9.ticket_triage_service.dto.TicketEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.am9.*

# Kafka producer: durability and bounded failure time
spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.max-poll-records=1
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.retry.backoff.ms=500

# Kafka topics
app.kafka.topic.tickets-created=tickets.created
app.kafka.topic.tickets-critical=tickets.critical
app.kafka.topic.tickets-medium=tickets.medium
app.kafka.topic.tickets-low=tickets.low
app.kafka.topic.tickets-dlq=tickets.dlq

# Google Gemini via Spring AI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false
