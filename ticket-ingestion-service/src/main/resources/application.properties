spring.application.name=ticket-ingestion-service
server.port=8080

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=ticketEvent:com.am9.ticket_ingestion_service.messaging.TicketEvent

# durability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.retry.backoff.ms=500

app.kafka.topic.tickets-created=tickets.created
app.idempotency.ttl-seconds=3600

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Event-driven support ticket triage engine (ticket ingestion service)
info.app.version=1.0